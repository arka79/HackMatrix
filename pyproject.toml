
[project]
name = "ci-doctor-arka"
version = "0.1.3"
description = "CI Doctor: investigates failing CI runs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "pydantic>=2",
    "defusedxml",
    "rapidfuzz",
    "httpx",
    "google-genai",
    "tomli-w",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ci-doctor-arka = "cidoctor.cli:app"

# Build configuration
[tool.hatch.build.targets.wheel]
only-include = ["src/cidoctor"]
sources = ["src"]

# Development dependencies
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-defusedxml",
]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "performance: performance tests",
    "security: security checklist tests",
]
addopts = []

# Ruff configuration
[tool.ruff]
line-length = 100

# Mypy configuration
[tool.mypy]
python_version = "3.11"
strict = true
disable_error_code = ["import-untyped"]
